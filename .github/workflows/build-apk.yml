name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then echo "::error::No .zip file found in the repository"; exit 1; fi
          echo "Using ZIP: $ZIP"
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/proj" -x "__MACOSX/*"
          SETTINGS=$(find "$RUNNER_TEMP/proj" -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path "*/__MACOSX/*" | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d" " -f2-)
          if [ -z "$SETTINGS" ]; then echo "::error::No Android project (settings.gradle) found inside the ZIP"; exit 1; fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
