name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract ZIP Project
        id: extract
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP project found in the repository."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Extracted project files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 3 -type f | head -100

      - name: Locate Android Gradle Project
        id: loc
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/extracted"

          SETTINGS=$(find "$ROOT" \
            -type f \
            \( -name "settings.gradle.kts" \
               -o -name "settings.gradle" \) \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            echo "The ZIP may not contain a complete Gradle project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Gradle project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Write google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          PROJECT_DIR="${{ steps.loc.outputs.dir }}"

          if [ -n "$GS_JSON" ]; then
            APP_DIR="$PROJECT_DIR/app"
            mkdir -p "$APP_DIR"
            printf '%s' "$GS_JSON" > "$APP_DIR/google-services.json"
            echo "google-services.json created."
          else
            echo "GOOGLE_SERVICES_JSON secret not configured; skipping."
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpotScope-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
